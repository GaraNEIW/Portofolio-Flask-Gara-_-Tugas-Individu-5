<!DOCTYPE html>
<html lang="id">
<head>

    <title>{% block title %}Portofolio Gara{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

        <p>&copy; 2026 Gara - UNTAG Surabaya</p>
